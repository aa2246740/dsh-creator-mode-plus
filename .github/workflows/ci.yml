name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --no-package-lock
      - name: Syntax and Harness-independent tests (blocking)
        run: npm run check:ci
      # These eight specs need a local Harness checkout with tsx and approver source.
      - name: Harness-runtime tests (non-blocking in CI)
        run: npm run check:harness
        continue-on-error: true
      - run: npm pack --dry-run
